; FlappyESP builds for two different Waveshare boards that share a name, a
; chip family and a 1.47" 172x320 panel size -- and almost nothing else.
; One env per board; pick one with `pio run -e <env>`.
;
;   esp32-c6-touch-lcd-1_47   ESP32-C6FH8, 8 MB flash, JD9853 panel,
;                             AXS5106L capacitive touch, IMU.  Tap to flap.
;   esp32-c6-lcd-1_47         ESP32-C6FH4, 4 MB flash, ST7789 panel, WS2812
;                             RGB LED, no touch.  BOOT button to flap.
;
; Neither board has a PlatformIO board definition, so both borrow the generic
; C6 DevKitC one and correct what it gets wrong. The pin maps live in
; boards/<name>/board_pins.h, selected by FLAPPY_BOARD (see CMakeLists.txt).

[platformio]
;default board to upload target
default_envs = esp32-c6-touch-lcd-1_47 

[env]
platform  = espressif32@7.1.0
board     = esp32-c6-devkitc-1
framework = espidf

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct

; The console is the SoC's native USB Serial/JTAG. Neither board has a
; USB-UART bridge, so there is no DTR/RTS auto-reset to drive.
monitor_rts = 0
monitor_dtr = 0

; Without these PlatformIO grabs the first /dev/cu.* it finds, which on macOS
; is a Bluetooth or AirPlay pseudo-port: the monitor then attaches to nothing
; and stays silent while the firmware runs perfectly.
; Linux: /dev/ttyACM*    Windows: the COM port the board enumerates as.
monitor_port = /dev/cu.usbmodem*
upload_port  = /dev/cu.usbmodem*


; --- Waveshare ESP32-C6-Touch-LCD-1.47 (SKU 31203) --------------------------
;   ESP32-C6FH8 (QFN32, 8 MB in-package flash, no PSRAM), 1.47" IPS 172x320
;   display JD9853 (SPI2), touch AXS5106L (I2C 0x63), IMU QMI8658A (I2C 0x6B),
;   TF slot on the display's SPI bus.
;
; Peripheral drivers are vendored under components/ -- no registry downloads:
;   components/jd9853    esp_lcd panel driver + the Waveshare init sequence
;   components/axs5106l  polling driver for the capacitive touch controller
[env:esp32-c6-touch-lcd-1_47]
board_build.cmake_extra_args = -DFLAPPY_BOARD=touch_lcd147

; The DevKitC definition's 8 MB happens to be right for the C6FH8.
board_upload.flash_size = 8MB


; --- Waveshare ESP32-C6-LCD-1.47, non-touch (SKU 28563) ---------------------
;   ESP32-C6FH4 (QFN32, 4 MB in-package flash, no PSRAM), 1.47" IPS 172x320
;   display ST7789 (SPI2, driver comes with esp_lcd), WS2812 RGB LED on
;   GPIO8, TF slot on the display's SPI bus. No touch, no IMU: the BOOT
;   button on GPIO9 is the whole input surface.
[env:esp32-c6-lcd-1_47]
board_build.cmake_extra_args = -DFLAPPY_BOARD=lcd147

; The C6FH4 carries 4 MB, not the DevKitC definition's 8 MB. These feed
; esptool and PlatformIO's size check; CONFIG_ESPTOOLPY_FLASHSIZE_4MB in
; sdkconfig.defaults.lcd147 feeds the image builder. Set only one and an
; oversized image links happily and then fails to boot.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
